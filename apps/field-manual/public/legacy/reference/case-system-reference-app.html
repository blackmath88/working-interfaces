<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b7778">
  <title>Adoption Lane · Interaction Architecture</title>
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('adoption-lane-theme') === 'dark' ? 'dark' : 'light';
    } catch {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <link rel="stylesheet" href="/legacy/reference/adoption-lane.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <button class="mobile-menu icon-button" id="menuButton" aria-label="Open navigation" aria-controls="primaryNav" aria-expanded="false">☰</button>
    <a class="product" href="#/control-center" data-route="/control-center" aria-label="Adoption Lane control center">
      <span class="product-mark" aria-hidden="true">AL</span>
      <span><b>Adoption Lane</b><small>Interaction architecture demo</small></span>
    </a>
    <span class="demo-badge">Fictional demo data</span>
    <div class="top-actions">
      <button class="button quiet" id="loadDemoButton">Demo-Daten laden</button>
      <button class="theme-toggle button quiet" id="themeButton" type="button" aria-label="Dark theme" aria-pressed="false" title="Switch to dark theme">
        <span class="theme-toggle__label">Theme</span>
        <span class="theme-toggle__icon" data-theme-icon aria-hidden="true">☾</span>
      </button>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" id="primaryNav" aria-label="Portfolio navigation">
      <a class="control-link" href="#/control-center" data-route="/control-center">Control Center</a>
      <div class="nav-heading">Customers & use cases</div>
      <nav id="customerNavigation"></nav>
      <div class="sidebar-actions">
        <button class="text-button" id="exportDataButton">Export current data</button>
        <button class="text-button" id="restoreDemoButton">Restore previous data</button>
        <button class="text-button danger-text" id="clearDemoButton">Clear demo data</button>
        <a class="text-button" href="../index.html">← Field Manual</a>
      </div>
    </aside>

    <main id="main" tabindex="-1">
      <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></nav>
      <div id="routeError" class="notice error" hidden></div>
      <div id="page"></div>
    </main>
  </div>

  <div class="panel-scrim" id="panelScrim" hidden></div>
  <aside class="context-panel" id="contextPanel" aria-labelledby="panelTitle" aria-hidden="true" tabindex="-1">
    <header class="panel-header">
      <div><div class="eyebrow judgment" id="panelKind">Supporting context</div><h2 id="panelTitle">Context</h2><p id="panelSubtitle"></p></div>
      <button class="icon-button" id="panelClose" aria-label="Close panel">×</button>
    </header>
    <div class="panel-body" id="panelBody"></div>
    <footer class="panel-actions" id="panelActions"></footer>
  </aside>

  <dialog id="confirmDialog" aria-labelledby="dialogTitle">
    <form method="dialog">
      <div class="eyebrow judgment">Confirmation</div>
      <h2 id="dialogTitle">Confirm action</h2>
      <p id="dialogBody"></p>
      <div class="dialog-actions">
        <button class="button quiet" value="cancel">Cancel</button>
        <button class="button danger" id="dialogConfirm" value="confirm">Confirm</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/legacy/reference/adoption-lane-app.mjs"></script>
</body>
</html>
