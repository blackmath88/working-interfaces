<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML prototype template</title>
  <style>
    body { max-width: 48rem; margin: 3rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <p><strong>Template · HTML experiment</strong></p>
    <h1>Prototype title</h1>
    <p>Duplicate this file and replace its contents. No framework or external dependency is required.</p>
    <button type="button" id="example">Test interaction</button>
  </main>
  <script>
    document.querySelector('#example').addEventListener('click', (event) => {
      event.currentTarget.textContent = 'Interaction works';
    });
  </script>
</body>
</html>
